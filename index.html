<body class="h-full bg-gray-50 font-main text-gray-700">
  <div class="h-full w-full flex overflow-hidden">
    <aside class="w-60 min-w-[240px] bg-white border-r border-gray-100 flex flex-col h-full min-h-0 overflow-y-auto">
      <div class="p-4 border-b border-gray-100 shrink-0"><h1 class="text-lg font-bold text-lila-500 flex items-center gap-2"><i data-lucide="wallet" class="w-5 h-5"></i><span>Mi plan de pagos</span></h1></div>
      <nav class="shrink-0 p-2.5 space-y-1" id="sideNav">
        <button class="sidebar-item active w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="dashboard"><i data-lucide="layout-dashboard" class="w-4 h-4"></i>Dashboard</button>
        <button class="sidebar-item w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="monthly"><i data-lucide="calendar" class="w-4 h-4"></i>Vista mensual</button>
        <button class="sidebar-item w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="biweekly"><i data-lucide="calendar-range" class="w-4 h-4"></i>Vista quincenal</button>
        <button class="sidebar-item w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="fixed"><i data-lucide="pin" class="w-4 h-4"></i>Pagos fijos</button>
        <button class="sidebar-item w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="installments"><i data-lucide="layers" class="w-4 h-4"></i>Pagos a meses</button>
        <button class="sidebar-item w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="variable"><i data-lucide="shuffle" class="w-4 h-4"></i>Pagos variados</button>
        <button class="sidebar-item w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="savings"><i data-lucide="piggy-bank" class="w-4 h-4"></i>Ahorro</button>
        <button class="sidebar-item w-full text-left px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-2" data-view="annual"><i data-lucide="bar-chart-3" class="w-4 h-4"></i>Resumen anual</button>

        <div class="relative text-xs font-semibold text-gray-500 mb-1">Ahorro total acumulado</div>

  <div id="modal" class="fixed inset-0 modal-bg z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90%] overflow-y-auto card-shadow" id="modalContent"></div>

    <div class="bg-white rounded-2xl p-6 w-full max-w-sm card-shadow text-center">
      <div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="trash-2" class="w-6 h-6 text-red-400"></i></div>
      <h3 class="font-bold text-gray-800 mb-2">¿Eliminar registro?</h3><p class="text-sm text-gray-500 mb-4">Esta acción no se puede deshacer.</p>

<script>
const MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];
const DEFAULT_CATEGORIES=['vivienda','servicios','suscripciones','educación','transporte','comida','salud','entretenimiento','compras','ahorro','otros'];
const CATEGORIES=DEFAULT_CATEGORIES;
const ACCOUNT_TYPES=['débito','crédito','efectivo','cuenta de ahorro','otro'];
const STORAGE_KEY='miplandepagos_estable_status_v4';
let state={
  currentMonth:5,currentYear:2026,
  config:{salaryMonthly:20000,salaryBiweekly:10000,payDate1:1,payDate2:16,savingsGoal:5000,currency:'MXN',yearEndExtras:{bonusEstimated:0,bonusReal:0,savingsFundEstimated:0,savingsFundReal:0,otherName:'Otro extra',otherEstimated:0,otherReal:0,notes:''}},
  fixed:[{id:'f1',concept:'Internet',category:'servicios',date:7,amount:1200,card:'BBVA',splitMode:'Dividir en dos quincenas',startMonth:5,startYear:2026,hasEndDate:false,month:5,year:2026,monthlyStatus:{}},{id:'f2',concept:'Renta',category:'vivienda',date:3,amount:7500,card:'BBVA',splitMode:'Cargar completo en Q1',startMonth:5,startYear:2026,hasEndDate:false,month:5,year:2026,monthlyStatus:{}}],
  installments:[{id:'i1',concept:'Laptop',totalAmount:18000,totalMonths:6,startMonth:4,startYear:2026,amount:3000,quincenaAmount:1500,purchaseCard:'Nu',card:'BBVA',status:'pendiente',notes:'Equipo de trabajo',splitMode:'Dividir en dos quincenas',month:4,year:2026,monthlyStatus:{}}],
  variable:[{id:'v1',concept:'Super',category:'comida',date:20,estimatedAmount:2200,amount:2000,card:'BBVA',paid:false,splitMode:'Cargar completo en Q2',apartadoQ1:false,apartadoQ2:true,month:5,year:2026}],
  savings:[{id:'s1',date:15,quincena:'Q1',amount:2500,card:'Nu',month:5,year:2026},{id:'s2',date:30,quincena:'Q2',amount:2500,card:'Nu',month:5,year:2026}],
  savingsGoals:[],
  monthNotes:{},
  accounts:[{id:'a1',name:'Nu',type:'crédito',bank:'Nu',notes:'Tarjeta principal'},{id:'a2',name:'BBVA',type:'débito',bank:'BBVA',notes:''},{id:'a3',name:'Efectivo',type:'efectivo',bank:'',notes:'Gastos en efectivo'}],
  categories:[...DEFAULT_CATEGORIES]
};
let currentView='dashboard',deleteTarget=null,savingsFilterMode='current',savingsFilterMonth=state.currentMonth,showSavingsForm=true,editingSavingId='';
let calendarFilter='all';
let selectedCalendarDay=null;
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)state=JSON.parse(saved);}catch(e){}
if(!state.config.yearEndExtras) state.config.yearEndExtras={bonusEstimated:0,bonusReal:0,savingsFundEstimated:0,savingsFundReal:0,otherName:'Otro extra',otherEstimated:0,otherReal:0,notes:''};
if(!state.config.payrollOverrides || typeof state.config.payrollOverrides!=='object') state.config.payrollOverrides={};
if(typeof state.config.dashboardPayDayQ1==='undefined') state.config.dashboardPayDayQ1=30;
if(typeof state.config.dashboardPayDayQ2==='undefined') state.config.dashboardPayDayQ2=15;
if(typeof state.config.savingsStartMonth==='undefined') state.config.savingsStartMonth=state.currentMonth??0;
if(typeof state.config.savingsStartYear==='undefined') state.config.savingsStartYear=state.currentYear??new Date().getFullYear();
if(!state.config.yearEndExtras.otherName) state.config.yearEndExtras.otherName='Otro extra';
if(!state.savingsGoals || !Array.isArray(state.savingsGoals)) state.savingsGoals=[];
if(!state.monthNotes || typeof state.monthNotes!=='object') state.monthNotes={};
if(!Array.isArray(state.fixed)) state.fixed=[];
if(!Array.isArray(state.installments)) state.installments=[];
if(!Array.isArray(state.variable)) state.variable=[];
if(!Array.isArray(state.savings)) state.savings=[];
if(!Array.isArray(state.accounts)) state.accounts=[];
if(!Array.isArray(state.categories)) state.categories=[...DEFAULT_CATEGORIES];
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function fmt(n){
  const value=Number(n)||0;
  const hasDecimals=Math.abs(value%1)>0.000001;
  return '$'+value.toLocaleString('es-MX',{minimumFractionDigits:hasDecimals?2:0,maximumFractionDigits:2});
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function getDaysInMonth(m,y){return new Date(y,m+1,0).getDate();}
function getFirstDayOfMonth(m,y){const d=new Date(y,m,1).getDay();return d===0?6:d-1;}
function monthIndex(m,y){return y*12+m;} function monthKey(m,y){return `${y}-${m}`;}
function pad2(n){return String(n).padStart(2,'0');}
function isoDate(y,m,d){return `${y}-${pad2(m+1)}-${pad2(d)}`;}
function formatShortDate(iso){
  if(!iso)return '';
  const [y,m,d]=String(iso).split('-').map(Number);
  if(!y||!m||!d)return '';
  return `${d} ${MONTHS[m-1].slice(0,3).toLowerCase()}`;
}
function formatLongDateFromParts(day,month,year){
  const d=Math.max(1,Math.min(parseInt(day)||1,getDaysInMonth(month,year)));
  return `${d} de ${MONTHS[month].toLowerCase()}`;
}
function getRealPaymentMonthYearForQuincena(item,q,m=state.currentMonth,y=state.currentYear){
  const vm=item.__viewMonth??m, vy=item.__viewYear??y;
  if(isLiquidationTarget(item,q,vm,vy)&&item.liquidation?.date){
    const [ly,lm]=item.liquidation.date.split('-').map(Number);return {month:lm-1,year:ly};
  }
  const target=getInstallmentPaymentTarget(item,q,vm,vy);
  if(target&&target.date){const [ty,tm]=target.date.split('-').map(Number);return {month:tm-1,year:ty};}
  return {month:m,year:y};
}
function getRealPaymentDayForQuincena(item,q){
  const vm=item.__viewMonth??state.currentMonth, vy=item.__viewYear??state.currentYear;
  if(isLiquidationTarget(item,q,vm,vy)&&item.liquidation?.date)return parseInt(item.liquidation.date.split('-')[2])||1;
  const target=getInstallmentPaymentTarget(item,q,vm,vy);
  if(target&&target.date)return parseInt(target.date.split('-')[2])||1;
  const plan=getPaymentPlan(item);
  if(plan==='Pagar mitad en Q1 y mitad en Q2'||plan==='Dividir en varias quincenas de pago'){
    const custom=q===1?item.paymentDayQ1:item.paymentDayQ2;
    if(parseInt(custom))return parseInt(custom);
  }
  return parseInt(item.date)||1;
}
function getPaymentDueLabel(item,q,m=state.currentMonth,y=state.currentYear){
  const due=getRealPaymentMonthYearForQuincena(item,q,m,y);
  const day=getRealPaymentDayForQuincena(item,q);
  return formatLongDateFromParts(day,due.month,due.year);
}
function getItemSetAsideDateLabel(item,q,m=state.currentMonth,y=state.currentYear){
  const day=getPaymentDayForQuincena(item,q);
  const safeDay=Math.max(1,Math.min(parseInt(day)||1,getDaysInMonth(m,y)));
  return `${safeDay} de ${MONTHS[m].toLowerCase()}`;
}
function getUpcomingSubtitle(item,q,status,m=state.currentMonth,y=state.currentYear){
  if(status==='pagado')return `Q${q} · pago completado`;
  if(status==='apartado')return `Q${q} · apartado listo`;
  return `Q${q} · apartado estimado ${getItemSetAsideDateLabel(item,q,m,y)}`;
}
function payrollOverrideKey(m=state.currentMonth,y=state.currentYear){return `${y}-${m}`;}
function getPayrollOverride(q,m=state.currentMonth,y=state.currentYear){
  const key=payrollOverrideKey(m,y);
  return state.config.payrollOverrides?.[key]?.[`q${q}`]||'';
}
function getPayrollDefaultDate(q,m=state.currentMonth,y=state.currentYear){
  if(q===1){
    const prev=addMonthOffset(m,y,-1);
    const day=parseInt(state.config.dashboardPayDayQ1)||30;
    return isoDate(prev.year,prev.month,Math.min(day,getDaysInMonth(prev.month,prev.year)));
  }
  const day=parseInt(state.config.dashboardPayDayQ2)||15;
  return isoDate(y,m,Math.min(day,getDaysInMonth(m,y)));
}
function getPayrollDate(q,m=state.currentMonth,y=state.currentYear){return getPayrollOverride(q,m,y)||getPayrollDefaultDate(q,m,y);}
function getPayrollDateLabel(q,m=state.currentMonth,y=state.currentYear){
  const isReal=!!getPayrollOverride(q,m,y);
  return `${isReal?'cobro real':'cobro estimado'} ${formatShortDate(getPayrollDate(q,m,y))}`;
}
function getDashboardQuincenaCycle(q,m=state.currentMonth,y=state.currentYear){
  const start=getPayrollDate(q,m,y);
  let end='';
  if(q===1){
    end=getPayrollDate(2,m,y);
  }else{
    const next=addMonthOffset(m,y,1);
    end=getPayrollDate(1,next.month,next.year);
  }
  return {start,end};
}
function getDashboardQuincenaPeriodLabel(q,m=state.currentMonth,y=state.currentYear){
  const c=getDashboardQuincenaCycle(q,m,y);
  return `Ciclo: ${formatShortDate(c.start)} → ${formatShortDate(c.end)}`;
}
function isoDateKey(iso){
  const [y,m,d]=String(iso||'').split('-').map(Number);
  if(!y||!m||!d)return 0;
  return y*10000+m*100+d;
}
function renderPayrollMonthControl(){
  const q1Real=!!getPayrollOverride(1,state.currentMonth,state.currentYear);
  const q2Real=!!getPayrollOverride(2,state.currentMonth,state.currentYear);
  return `<div class="flex items-center gap-2 bg-white border border-gray-100 rounded-xl px-3 py-2 card-shadow">
    <div class="text-[11px] leading-tight"><span class="block text-gray-400">Q1 inicia con ${q1Real?'cobro real':'cobro estimado'}</span><b class="text-azul-500">${formatShortDate(getPayrollDate(1))}</b></div>
    <div class="w-px h-7 bg-gray-100"></div>
    <div class="text-[11px] leading-tight"><span class="block text-gray-400">Q2 inicia con ${q2Real?'cobro real':'cobro estimado'}</span><b class="text-menta-500">${formatShortDate(getPayrollDate(2))}</b></div>
    <button onclick="openPayrollMonthModal()" class="ml-1 w-8 h-8 rounded-lg bg-lila-50 text-lila-500 hover:bg-lila-100 flex items-center justify-center" title="Editar cobros de este mes"><i data-lucide="settings" class="w-4 h-4"></i></button>
  </div>`;
}
function totalArr(arr,field='amount'){return (arr||[]).reduce((s,p)=>s+(parseFloat(p[field])||0),0);}
function isSavingConfirmed(s){return s && s.confirmed===true;}
function getSavingPlannedAmount(s){return parseFloat(s?.plannedAmount ?? s?.amount)||0;}
function getSavingRealAmount(s){return isSavingConfirmed(s)?(parseFloat(s?.amount)||getSavingPlannedAmount(s)):0;}
function confirmedSavings(list=state.savings){return (list||[]).filter(isSavingConfirmed);}
function totalConfirmedSavings(list=state.savings){
  const base=confirmedSavings(list).reduce((s,p)=>s+getSavingRealAmount(p),0);
  if(list===state.savings)return Math.max(0,base-getLiquidationSavingsTotal());
  const keys=new Set((list||[]).map(x=>`${x.year}-${x.month}`));
  const used=(state.installments||[]).reduce((sum,i)=>{
    if(!isInstallmentLiquidated(i)||i.liquidation.source!=='savings')return sum;
    const [y,m]=String(i.liquidation.date||'').split('-').map(Number);
    return keys.has(`${y}-${m-1}`)?sum+(parseFloat(i.liquidation.amount)||0):sum;
  },0);
  return Math.max(0,base-used);
}
function normalizeQuincena(v,date){const x=String(v||'').toLowerCase().trim();if(x==='q1'||x==='1'||x.includes('1'))return 'Q1';if(x==='q2'||x==='2'||x.includes('2'))return 'Q2';return (parseInt(date)||1)<=15?'Q1':'Q2';}
function getAccounts(){return state.accounts||[];} function getAccountOptions(selected=''){const a=getAccounts();if(!a.length)return '<option value="">Primero agrega una tarjeta/cuenta en Configuración</option>';return a.map(x=>`<option value="${escapeHtml(x.name)}" ${selected===x.name?'selected':''}>${escapeHtml(x.name)}</option>`).join('');}
function getCategories(){
  if(!state.categories || !Array.isArray(state.categories)) state.categories=[...DEFAULT_CATEGORIES];
  const used=[...state.fixed,...state.variable].map(i=>i.category).filter(Boolean);
  return [...new Set([...state.categories,...used])];
}
function getCategoryOptions(selected=''){
  return getCategories().map(c=>`<option value="${escapeHtml(c)}" ${selected===c?'selected':''}>${escapeHtml(c)}</option>`).join('');
}
function addCategoryIfNeeded(name){
  const clean=String(name||'').trim().toLowerCase();
  if(!clean) return '';
  if(!state.categories || !Array.isArray(state.categories)) state.categories=[...DEFAULT_CATEGORIES];
  if(!state.categories.includes(clean)) state.categories.push(clean);
  return clean;
}
function isFixedActiveInMonth(item,m,y){const sm=item.startMonth??item.month??0,sy=item.startYear??item.year??state.currentYear;if(monthIndex(m,y)<monthIndex(sm,sy))return false;if(item.hasEndDate){const em=item.endMonth??sm,ey=item.endYear??sy;if(monthIndex(m,y)>monthIndex(em,ey))return false;}return true;}
function getFixedStatus(item,m=state.currentMonth,y=state.currentYear){if(!item.monthlyStatus)item.monthlyStatus={};const k=monthKey(m,y);if(!item.monthlyStatus[k])item.monthlyStatus[k]={apartadoQ1:false,apartadoQ2:false,paid:false};return item.monthlyStatus[k];}
function getFixedPeriodText(item){const sm=item.startMonth??item.month??0,sy=item.startYear??item.year??state.currentYear;if(!item.hasEndDate)return `${MONTHS[sm]} ${sy} · sin fecha límite`;return `${MONTHS[sm]} ${sy} - ${MONTHS[item.endMonth??sm]} ${item.endYear??sy}`;}

function getInstallmentPaymentTargets(item){
  if(getPaymentPlan(item)!=='Dividir en varias quincenas de pago')return [];
  const generated=getSequentialQuincenaTargets(item,'payment');
  const saved=Array.isArray(item.paymentSchedule)?item.paymentSchedule:[];
  const defaultAmount=parseFloat(item.quincenaAmount)||((parseFloat(item.amount)||0)/2)||0;
  return generated.map((t,i)=>{
    const existing=saved.find(s=>parseInt(s.index)===i+1)||saved[i]||{};
    const baseDay=t.q===1?(parseInt(item.paymentDayQ1)||parseInt(item.date)||1):(parseInt(item.paymentDayQ2)||parseInt(item.date)||16);
    const safeDay=Math.max(1,Math.min(baseDay,getDaysInMonth(t.month,t.year)));
    return {
      index:i+1,
      month:t.month,
      year:t.year,
      q:t.q,
      date:existing.date||isoDate(t.year,t.month,safeDay),
      amount:parseFloat(existing.amount)||defaultAmount
    };
  });
}
function getInstallmentPaymentTarget(item,q,m=item.__viewMonth??state.currentMonth,y=item.__viewYear??state.currentYear){

function toggleApartado(id,col,q){
  if(col==='goalContrib'){
    const goal=(state.savingsGoals||[]).find(g=>g.id===id);
    if(!goal)return;
    const target=q===1?'Q1':'Q2';
    const existing=state.savings.find(s=>s.goalId===id&&s.month===state.currentMonth&&s.year===state.currentYear&&normalizeQuincena(s.quincena,s.date)===target);
    if(existing){
      state.savings=state.savings.filter(s=>s.id!==existing.id);
    }else{
      const amount=getGoalContributionAmount(goal,q);
      if(amount>0){state.savings.push({id:uid(),date:q===1?(state.config.payDate1||1):(state.config.payDate2||16),quincena:target,amount,card:goal.card||'',goalId:id,month:state.currentMonth,year:state.currentYear});}
    }
    saveState();render();return;
  }
  const item=state[col].find(i=>i.id===id);if(!item)return;if(col==='fixed'){const s=getFixedStatus(item);if(q===1)s.apartadoQ1=!s.apartadoQ1;else s.apartadoQ2=!s.apartadoQ2;}else if(col==='installments'){const s=getInstallmentStatus(item);if(q===1)s.apartadoQ1=!s.apartadoQ1;else s.apartadoQ2=!s.apartadoQ2;}else{if(q===1)item.apartadoQ1=!item.apartadoQ1;else item.apartadoQ2=!item.apartadoQ2;}saveState();render();}
function togglePaid(id,col,q=null){
  if(col==='goalContrib')return;
  const item=state[col].find(i=>i.id===id);
  if(!item)return;
  const plan=getPaymentPlan(item);
  const isSplitPaid=plan==='Pagar mitad en Q1 y mitad en Q2'||plan==='Dividir en varias quincenas de pago';
  if(isSplitPaid&&q){
    if(col==='fixed'){
      const s=getFixedStatus(item); if(q===1)s.paidQ1=!s.paidQ1; else s.paidQ2=!s.paidQ2;
      s.paid=!!(s.paidQ1&&s.paidQ2);
    }else if(col==='installments'){
      const s=getInstallmentStatus(item); if(q===1)s.paidQ1=!s.paidQ1; else s.paidQ2=!s.paidQ2;
      s.paid=!!(s.paidQ1&&s.paidQ2);
    }else{
      if(q===1)item.paidQ1=!item.paidQ1; else item.paidQ2=!item.paidQ2;
      item.paid=!!(item.paidQ1&&item.paidQ2);
    }
  }else if(col==='fixed'){
    const s=getFixedStatus(item);s.paid=!s.paid;
  }else if(col==='installments'){
    const s=getInstallmentStatus(item);s.paid=!s.paid;
  }else item.paid=!item.paid;
  saveState();render();
}
function getCalendarItemsForDay(day){
  const p=getPaymentsForMonth(state.currentMonth,state.currentYear),items=[];

  const addPayments=(arr,type,label)=>arr.forEach(item=>{
    [1,2].forEach(q=>{
      const apartAmount=getAmountToSetAside(item,q);
      if(apartAmount<=0)return;

      const due=getRealPaymentMonthYearForQuincena(item,q,state.currentMonth,state.currentYear);
      if(due.month!==state.currentMonth||due.year!==state.currentYear)return;

      const realDay=getRealPaymentDayForQuincena(item,q);
      if(realDay!==day)return;

      const col=getPaymentCollection(item);
      const payAmount=getPaymentPlanAmountForQ(item,q);
      const displayAmount=payAmount>0?payAmount:apartAmount;
      const status=getPaymentStatusForQuincena(item,q);

      items.push({
        id:item.id,
        raw:item,
        col,
        q,
        concept:item.concept||item.notes||'Registro',
        type,
        label,
        card:item.card||'-',
        amount:displayAmount,
        apartAmount,
        status,
        canApart:col!=='savings',
        canPay:shouldShowPaidCheckbox(item,q,state.currentMonth,state.currentYear),
        apartado:isSetAside(item,q),
        pagado:isPaidForQuincena(item,q),
        dueDay:realDay,
        dueMonth:due.month,
        dueYear:due.year
      });
    });
  });

  addPayments(p.fixed,'fijo','Pago fijo');
  // Pagos a meses: buscar por fecha real de cada cuota, aunque la cuota financiera pertenezca a otro ciclo/mes.
  (state.installments||[]).forEach(base=>{
    const targets=getPaymentPlan(base)==='Dividir en varias quincenas de pago'?getInstallmentPaymentTargets(base):[];
    if(targets.length){
      targets.forEach(t=>{
        if(isInstallmentTargetCancelledByLiquidation(base,t.q,t.month,t.year))return;
        const [dy,dm,dd]=String(t.date||'').split('-').map(Number);
        if(dy!==state.currentYear||dm-1!==state.currentMonth||dd!==day)return;
        const view={...base,__collection:'installments',__viewMonth:t.month,__viewYear:t.year,month:t.month,year:t.year};
        const s=getInstallmentStatus(base,t.month,t.year);view.paidQ1=!!s.paidQ1;view.paidQ2=!!s.paidQ2;view.apartadoQ1=!!s.apartadoQ1;view.apartadoQ2=!!s.apartadoQ2;
        items.push({id:base.id,raw:view,col:'installments',q:t.q,concept:getInstallmentDisplayConcept(view,t.q,t.month,t.year),type:'meses',label:'Pago a meses',card:base.card||'-',amount:parseFloat(t.amount)||0,apartAmount:getAmountToSetAside(view,t.q),status:getPaymentStatusForQuincena(view,t.q),canApart:true,canPay:true,apartado:isSetAside(view,t.q),pagado:isPaidForQuincena(view,t.q),dueDay:dd,dueMonth:dm-1,dueYear:dy});
      });
    }else addPayments(getPaymentsForMonth(state.currentMonth,state.currentYear).inst.filter(x=>x.id===base.id),'meses','Pago a meses');
    if(isInstallmentLiquidated(base)&&base.liquidation.source==='savings'){
      const [ly,lm,ld]=String(base.liquidation.date||'').split('-').map(Number);
      if(ly===state.currentYear&&lm-1===state.currentMonth&&ld===day)items.push({id:base.id,raw:base,col:'liquidationSavings',q:0,concept:`${base.concept} · Liquidación`,type:'meses',label:'Liquidación anticipada',card:'Ahorro general',amount:parseFloat(base.liquidation.amount)||0,apartAmount:0,status:'pagado',canApart:false,canPay:false,apartado:true,pagado:true,dueDay:ld,dueMonth:lm-1,dueYear:ly});
    }
  });
  addPayments(p.vari,'variado','Pago variado');
  addPayments(p.goals||[],'ahorro','Ahorro');

  return items.sort((a,b)=>a.concept.localeCompare(b.concept,'es'));
}

function calendarItemPassesFilter(item){
  if(calendarFilter==='pending')return item.status==='pendiente';
  if(calendarFilter==='apartado')return item.status==='apartado';
  if(calendarFilter==='pagado')return item.status==='pagado';
  return true;
}

function getCalendarCobrosForDay(day){
  const result=[];
  [1,2].forEach(q=>{
    const iso=getPayrollDate(q,state.currentMonth,state.currentYear);
    const [y,m,d]=String(iso||'').split('-').map(Number);
    if(y===state.currentYear && m===state.currentMonth+1 && d===day){
      result.push({q,date:iso,amount:getBiweeklyAvailableIncome(q,state.currentMonth,state.currentYear)});
    }
  });

  const next=addMonthOffset(state.currentMonth,state.currentYear,1);
  const nextQ1=getPayrollDate(1,next.month,next.year);
  const [ny,nm,nd]=String(nextQ1||'').split('-').map(Number);
  if(ny===state.currentYear && nm===state.currentMonth+1 && nd===day){
    result.push({q:1,date:nextQ1,amount:(state.config.salaryBiweekly||0),nextMonth:true});
  }
  return result;
}

function setCalendarFilter(filter){
  calendarFilter=filter;
  renderMiniCalendar();
  renderCalendarDayDetail();
  renderCalendarCycleAgenda();
  lucide.createIcons();
}

function selectCalendarDay(day){
  selectedCalendarDay=day;
  renderMiniCalendar();
  renderCalendarDayDetail();
  renderCalendarCycleAgenda();
  lucide.createIcons();
}

function getSelectedCalendarDay(){
  const days=getDaysInMonth(state.currentMonth,state.currentYear);
  if(selectedCalendarDay && selectedCalendarDay>=1 && selectedCalendarDay<=days)return selectedCalendarDay;

  const today=new Date();
  if(today.getFullYear()===state.currentYear && today.getMonth()===state.currentMonth){
    selectedCalendarDay=today.getDate();
    return selectedCalendarDay;
  }

  for(let d=1;d<=days;d++){
    if(getCalendarItemsForDay(d).some(calendarItemPassesFilter)){
      selectedCalendarDay=d;
      return d;
    }
  }

  selectedCalendarDay=1;
  return 1;
}

function renderCalendarFilters(){
  const options=[
    ['all','Todos'],
    ['pending','Pendientes'],
    ['apartado','Apartados'],
    ['pagado','Pagados']
  ];

    all:'bg-lila-100 text-lila-600 border-lila-200',
    pending:'bg-durazno-50 text-durazno-500 border-durazno-100',
    apartado:'bg-azul-50 text-azul-500 border-azul-100',
    pagado:'bg-menta-50 text-menta-500 border-menta-100'
  };
  const el=document.getElementById('calendarFilters');
  if(!el)return;
  el.innerHTML=options.map(([key,label])=>`
    <button onclick="setCalendarFilter('${key}')" class="text-[10px] px-2.5 py-1 rounded-full border font-semibold transition ${calendarFilter===key?cls[key]:'bg-white text-gray-400 border-gray-100 hover:bg-gray-50'}">${label}</button>
  `).join('');
}

function renderMiniCalendar(){
  const m=state.currentMonth,y=state.currentYear;
  const today=new Date(),todayDay=today.getDate(),todayMonth=today.getMonth(),todayYear=today.getFullYear();
  const days=getDaysInMonth(m,y),first=getFirstDayOfMonth(m,y);
  const selected=getSelectedCalendarDay();

  const title=document.getElementById('miniCalTitle');
  if(title)title.textContent=`${MONTHS[m]} ${y}`;
  renderCalendarFilters();

  let html='<div class="grid grid-cols-7 gap-1">';
  DAYS.forEach(d=>html+=`<div class="text-center text-[10px] font-semibold text-gray-400 py-1">${d}</div>`);
  for(let i=0;i<first;i++)html+='<div></div>';

  for(let d=1;d<=days;d++){
    const rawItems=getCalendarItemsForDay(d);
    const items=rawItems.filter(calendarItemPassesFilter);
    const cobros=getCalendarCobrosForDay(d);
    const isToday=d===todayDay&&m===todayMonth&&y===todayYear;
    const isSelected=d===selected;

    const statuses=new Set(items.map(i=>i.status));
    let dots='<div class="flex gap-1 justify-center min-h-[8px] mt-1">';
    if(cobros.length)dots+='<span class="w-1.5 h-1.5 rounded-full bg-lila-400"></span>';
    if(statuses.has('pendiente'))dots+='<span class="w-1.5 h-1.5 rounded-full bg-durazno-400"></span>';
    if(statuses.has('apartado'))dots+='<span class="w-1.5 h-1.5 rounded-full bg-azul-400"></span>';
    if(statuses.has('pagado'))dots+='<span class="w-1.5 h-1.5 rounded-full bg-menta-400"></span>';
    dots+='</div>';

    const total=items.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
    const amountLabel=items.length?`<div class="text-[8px] font-semibold text-gray-500 mt-0.5 truncate">${fmt(total)}</div>`:'<div class="h-[12px]"></div>';
    const countLabel=items.length>1?`<div class="text-[7px] text-gray-400">${items.length} pagos</div>`:'<div class="h-[9px]"></div>';

    html+=`
      <button onclick="selectCalendarDay(${d})" class="min-h-[62px] rounded-xl border px-1 py-1.5 text-center transition
        ${isSelected?'bg-lila-50 border-lila-200 ring-2 ring-lila-100':
          isToday?'bg-white border-lila-200':
          (items.length||cobros.length)?'bg-white border-gray-100 hover:bg-gray-50':'bg-gray-50/40 border-transparent hover:bg-gray-50'}">
        <div class="flex items-center justify-center gap-1">
          <span class="text-xs ${isSelected?'font-extrabold text-lila-600':isToday?'font-extrabold text-lila-500':'text-gray-600'}">${d}</span>
          ${cobros.length?'<i data-lucide="wallet-cards" class="w-2.5 h-2.5 text-lila-500"></i>':''}
        </div>
        ${dots}
        ${amountLabel}
        ${countLabel}
      </button>`;
  }

  html+='</div>';
  const el=document.getElementById('miniCalendar');
  if(el)el.innerHTML=html;
}

function getCalendarCycleForDay(day){
  const iso=isoDate(state.currentYear,state.currentMonth,day);
  const key=isoDateKey(iso);

  const c1=getDashboardQuincenaCycle(1,state.currentMonth,state.currentYear);
  const c2=getDashboardQuincenaCycle(2,state.currentMonth,state.currentYear);

  if(key>=isoDateKey(c1.start) && key<isoDateKey(c1.end))return {q:1,...c1};
  if(key>=isoDateKey(c2.start) && key<isoDateKey(c2.end))return {q:2,...c2};

  return day<(parseInt(String(c2.start).split('-')[2])||15)?{q:1,...c1}:{q:2,...c2};
}

function getCycleAgendaItems(q){
  const {all}=getBiweeklyItems(state.currentMonth,state.currentYear);
  return all.filter(item=>getAmountToSetAside(item,q)>0).map(item=>{
    const due=getRealPaymentMonthYearForQuincena(item,q,state.currentMonth,state.currentYear);
    const day=getRealPaymentDayForQuincena(item,q);
    const col=getPaymentCollection(item);
    const status=getPaymentStatusForQuincena(item,q);
    const amount=getPaymentPlanAmountForQ(item,q)>0?getPaymentPlanAmountForQ(item,q):getAmountToSetAside(item,q);
    return {item,col,q,day,month:due.month,year:due.year,status,amount,concept:getPaymentCollection(item)==='installments'?getInstallmentDisplayConcept(item,q):item.concept||'Registro'};
  }).sort((a,b)=>monthIndex(a.month,a.year)-monthIndex(b.month,b.year)||a.day-b.day);
}

function getMonthlyHealth(free, usedPct){

  if (usedPct >= 60) return { label:'Estable', cls:'bg-rosa-50 text-rosa-500 border-rosa-100', dot:'bg-rosa-400', note:'mes controlado' };
  return { label:'Saludable', cls:'bg-aqua-50 text-aqua-500 border-aqua-200', dot:'bg-aqua-500', note:'buen margen libre' };
}
function getYearMonthlyData(){

    const savingsPlanningItems=makeSavingsPlanningItems(p);
    const fixed=getPlanTotal(p.fixed), inst=getPlanTotal(p.inst), vari=getPlanTotal(p.vari), sav=getApartTotal([...(p.goals||[]),...savingsPlanningItems]);
    const payments=fixed+inst+vari;
    const out=payments+sav;
    const free=income-out;
    const used=income>0?Math.min(140,Math.round((out/income)*100)):0;
    const paid=paidArr([...p.fixed,...p.inst,...p.vari]);
    const apartado=getApartTotal([...p.fixed,...p.inst,...p.vari]);
    const pending=Math.max(0,payments-apartado);
    return { name, month, income, fixed, inst, vari, sav, payments, out, free, used, paid, apartado, pending, health:getMonthlyHealth(free,used) };
  });
}

function getBiweeklyHealth(free, usedPct){

}

function getSavingsForFilter(){if(savingsFilterMode==='all')return state.savings;const m=savingsFilterMode==='choose'?savingsFilterMonth:state.currentMonth;return state.savings.filter(s=>s.month===m&&s.year===state.currentYear);}function setSavingsFilter(mode){savingsFilterMode=mode;if(mode==='current')savingsFilterMonth=state.currentMonth;renderSavingsView();lucide.createIcons();}function setSavingsFilterMonth(v){savingsFilterMonth=parseInt(v);savingsFilterMode='choose';renderSavingsView();lucide.createIcons();}function toggleSavingsForm(){showSavingsForm=!showSavingsForm;editingSavingId='';renderSavingsView();lucide.createIcons();}function editSavingInline(id){editingSavingId=id;showSavingsForm=true;renderSavingsView();lucide.createIcons();}

er-azul-100 rounded-lg p-3 text-xs text-azul-500 mt-3">Los ahorros se registran en el mes que selecciones. El resumen de arriba muestra solo el mes actual seleccionado.</div></div><div class="col-span-4">${form}</div></div>`;

function renderSavingsGoalCards(goals){
  if(!goals.length) return `<div class="col-span-2 bg-gray-50 border border-gray-100 rounded-xl p-5 text-center text-sm text-gray-400">No hay metas activas en ${MONTHS[state.currentMonth]} ${state.currentYear}. Crea una meta con fecha de inicio y final para que aparezca aquí.</div>`;

class="font-bold text-azul-500">${fmt(p.savedThisMonth)}</div></div><div><span class="text-gray-400">Plan</span><div class="font-bold text-lila-500">${goal.planType==='biweekly'?`${fmt(goal.planAmount||0)} / quincena`:`${fmt(goal.planAmount||0)} / mes`}</div></div></div>${goal.notes?`<div class="text-[11px] text-gray-500 mt-3 bg-white/60 rounded-lg p-2">${escapeHtml(goal.notes)}</div>`:''}</div>`;}).join('');
}
function openSavingsGoalModal(id=''){const goal=(state.savingsGoals||[]).find(g=>g.id===id);document.getElementById('modalContent').innerHTML=`<div class="p-5"><div class="flex justify-between mb-4"><h3 class="font-bold flex items-center gap-2"><i data-lucide="target" class="w-4 h-4 text-lila-500"></i>${goal?'Editar':'Nueva'} meta de ahorro</h3><button onclick="closeModal()" class="text-xl text-gray-400 hover:text-gray-600 leading-none">×</button></div><form class="space-y-3" onsubmit="saveSavingsGoal(event,'${goal?.id||''}')"><div><label class="block text-xs mb-1">Nombre de la meta</label><input name="name" value="${escapeHtml(goal?.name||'')}" placeholder="Ej. Viaje, mudanza, laptop" class="w-full border rounded-lg px-3 py-2 text-sm"></div><div><label class="block text-xs mb-1">Monto objetivo</label><input type="number" step="any" name="amount" value="${goal?.amount||0}" class="w-full border rounded-lg px-3 py-2 text-sm"></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs mb-1">Mes de inicio</label><select name="startMonth" onchange="updatePlanFieldsPreview(this.form)" class="w-full border rounded-lg px-3 py-2 text-sm">${MONTHS.map((m,i)=>`<option value="${i}" ${(goal?.startMonth??state.currentMonth)===i?'selected':''}>${m}</option>`).join('')}</select></div><div><label class="block text-xs mb-1">Año de inicio</label><input type="number" name="startYear" value="${goal?.startYear??state.currentYear}" class="w-full border rounded-lg px-3 py-2 text-sm"></div></div><div class="grid grid-cols-2 gap-3"><div><label class="block text-xs mb-1">Mes final</label><select name="endMonth" class="w-full border rounded-lg px-3 py-2 text-sm">${MONTHS.map((m,i)=>`<option value="${i}" ${(goal?.endMonth??state.currentMonth)===i?'selected':''}>${m}</option>`).join('')}</select></div><div><label class="block text-xs mb-1">Año final</label><input type="number" name="endYear" value="${goal?.endYear??state.currentYear}" class="w-full border rounded-lg px-3 py-2 text-sm"></div></div><div><label class="block text-xs mb-1">Plan de ahorro</label><select name="planType" class="w-full border rounded-lg px-3 py-2 text-sm"><option value="monthly" ${(!goal?.planType||goal?.planType==='monthly')?'selected':''}>Ahorrar por mes</option><option value="biweekly" ${goal?.planType==='biweekly'?'selected':''}>Ahorrar por quincena</option></select><p class="text-[11px] text-gray-400 mt-1">Si eliges por mes, se divide en Q1 y Q2. Si eliges por quincena, esa cantidad aparece en cada quincena.</p></div><div><label class="block text-xs mb-1">Cantidad a apartar según el plan</label><input type="number" step="any" name="planAmount" value="${goal?.planAmount||0}" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Ej. 1000"></div><div><label class="block text-xs mb-1">Cuenta sugerida</label><select name="card" class="w-full border rounded-lg px-3 py-2 text-sm">${getAccountOptions(goal?.card||'')}</select></div><div><label class="block text-xs mb-1">Notas</label><textarea name="notes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Ej. objetivo, fechas, detalles del viaje">${escapeHtml(goal?.notes||'')}</textarea></div><div class="flex gap-2 pt-2"><button class="flex-1 bg-lila-500 text-white rounded-lg py-2 text-sm font-semibold">Guardar meta</button><button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-gray-100 text-sm">Cancelar</button></div></form></div>`;document.getElementById('modal').classList.remove('hidden');lucide.createIcons();}
function saveSavingsGoal(event,id=''){event.preventDefault();const fd=new FormData(event.target),payload={name:fd.get('name')||'Meta de ahorro',amount:parseFloat(fd.get('amount'))||0,startMonth:parseInt(fd.get('startMonth'))||0,startYear:parseInt(fd.get('startYear'))||state.currentYear,endMonth:parseInt(fd.get('endMonth'))||0,endYear:parseInt(fd.get('endYear'))||state.currentYear,card:fd.get('card')||'',planType:fd.get('planType')||'monthly',planAmount:parseFloat(fd.get('planAmount'))||0,notes:fd.get('notes')||''};if(monthIndex(payload.endMonth,payload.endYear)<monthIndex(payload.startMonth,payload.startYear)){payload.endMonth=payload.startMonth;payload.endYear=payload.startYear;}if(id){const g=state.savingsGoals.find(x=>x.id===id);if(g)Object.assign(g,payload);}else state.savingsGoals.push({id:uid(),...payload});saveState();closeModal();render();}
function deleteSavingsGoal(id){if(!confirm('¿Eliminar esta meta de ahorro? Los ahorros guardados se quedan, pero pasarán a ahorro general.'))return;state.savingsGoals=state.savingsGoals.filter(g=>g.id!==id);state.savings.forEach(s=>{if(s.goalId===id)s.goalId='';});saveState();render();}

      <div><label class="block text-xs mb-1">Meta de ahorro</label><select name="goalId" class="w-full border rounded-lg px-3 py-2 text-sm">${getSavingsGoalOptions(item?.goalId||'')}</select></div>
      <div><label class="block text-xs mb-1">Meta / planeado</label><input type="number" step="any" name="plannedAmount" value="${plannedValue}" class="w-full border rounded-lg px-3 py-2 text-sm"><p class="text-[11px] text-gray-400 mt-1">Es lo que pensabas juntar. Queda como recordatorio y no se suma como ahorro real.</p></div>
      <div><label class="block text-xs mb-1">Real guardado</label><input type="number" step="any" name="amount" value="${realValue}" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Puede ser igual, mayor o menor"><p class="text-[11px] text-gray-400 mt-1">Es lo que ya juntaste/guardaste. Solo este monto se suma cuando el estado está cumplido.</p></div>
      <div><label class="block text-xs mb-1">Cuenta donde se guardó</label><select name="card" class="w-full border rounded-lg px-3 py-2 text-sm">${getAccountOptions(item?.card||'')}</select></div>

      <div class="flex gap-2 pt-2"><button class="flex-1 bg-lila-500 text-white rounded-lg py-2 text-sm font-semibold">${item?'Guardar':'Agregar'}</button><button type="button" onclick="${cancelAction}" class="px-4 py-2 rounded-lg bg-gray-100 text-sm">Cancelar</button></div>
    </form>
  </div>`;
}
function saveSavingForm(event,id=''){event.preventDefault();const fd=new FormData(event.target);const planned=parseFloat(fd.get('plannedAmount'))||0;const confirmed=fd.get('confirmed')==='true';const realInput=fd.get('amount');const real=realInput===''||realInput===null?planned:(parseFloat(realInput)||0);const payload={date:parseInt(fd.get('date'))||1,month:parseInt(fd.get('month')),year:state.currentYear,quincena:normalizeQuincena(fd.get('quincena'),fd.get('date')),goalId:fd.get('goalId')||'',plannedAmount:planned,amount:real,card:fd.get('card')||'',confirmed};if(Number.isNaN(payload.month))payload.month=state.currentMonth;if(id){const item=state.savings.find(s=>s.id===id);if(item)Object.assign(item,payload);}else state.savings.push({id:uid(),...payload});editingSavingId='';saveState();closeModal();render();}
function toggleSavingConfirmed(id){const item=state.savings.find(s=>s.id===id);if(!item)return;if(!isSavingConfirmed(item)&&!(parseFloat(item.amount)>0))item.amount=getSavingPlannedAmount(item);item.confirmed=!isSavingConfirmed(item);saveState();render();}

function saveExtraIncomeForm(event,id=''){

function buildPaymentScheduleFromForm(form){
  if(!form||form.dataset.recordType!=='installment')return [];
  const count=Math.max(1,parseInt(form.querySelector('[name="paymentQuincenas"]')?.value)||2);
  const temp={startMonth:parseInt(form.querySelector('[name="startMonth"]')?.value)||0,startYear:parseInt(form.querySelector('[name="startYear"]')?.value)||state.currentYear,paymentFirstQuincena:form.querySelector('[name="paymentFirstQuincena"]')?.value||'current-q1',paymentQuincenas:count};
  const targets=getSequentialQuincenaTargets(temp,'payment');
  const item=(state.installments||[]).find(i=>i.id===form.dataset.itemId);
  const saved=Array.isArray(item?.paymentSchedule)?item.paymentSchedule:[];
  const amount=parseFloat(form.querySelector('[name="quincenaAmount"]')?.value)||0;
  return targets.map((t,i)=>{
    const existing=saved.find(s=>parseInt(s.index)===i+1)||saved[i]||{};
    const defaultDay=t.q===1?(parseInt(item?.paymentDayQ1)||parseInt(item?.date)||1):(parseInt(item?.paymentDayQ2)||parseInt(item?.date)||16);
    const safe=Math.max(1,Math.min(defaultDay,getDaysInMonth(t.month,t.year)));

  if(value)state.config.payrollOverrides[key][`q${q}`]=value;
  else delete state.config.payrollOverrides[key][`q${q}`];
}
function getSavingsGoalMonthsInYear(year=state.currentYear){
  const sm=parseInt(state.config.savingsStartMonth)||0;
  const sy=parseInt(state.config.savingsStartYear)||year;
  if(year<sy)return 0;
  if(year>sy)return 12;
  return Math.max(0,12-sm);
}
function getAnnualSavingsGoalStats(year=state.currentYear){
  const monthly=parseFloat(state.config.savingsGoal)||0;
  const biweekly=monthly/2;
  const activeMonths=getSavingsGoalMonthsInYear(year);
  const estimated=monthly*activeMonths;
  const real=(state.savings||[]).filter(s=>s.year===year&&!s.goalId&&isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingRealAmount(s),0);
  const planned=(state.savings||[]).filter(s=>s.year===year&&!s.goalId&&!isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingPlannedAmount(s),0);
  const diff=real-estimated;
  return {monthly,biweekly,activeMonths,estimated,real,planned,diff,missing:Math.max(0,estimated-real)};
}
function getGoalAnnualStats(goal,year=state.currentYear){
  const start=monthIndex(goal.startMonth??0,goal.startYear??year);
  const end=monthIndex(goal.endMonth??goal.startMonth??0,goal.endYear??goal.startYear??year);
  const yStart=monthIndex(0,year), yEnd=monthIndex(11,year);
  const overlapStart=Math.max(start,yStart), overlapEnd=Math.min(end,yEnd);
  const activeMonths=overlapEnd>=overlapStart?(overlapEnd-overlapStart+1):0;
  const totalMonths=Math.max(1,end-start+1);
  const objective=parseFloat(goal.amount)||0;
  const monthlyTarget=objective/totalMonths;
  const estimated=monthlyTarget*activeMonths;
  const real=(state.savings||[]).filter(s=>s.year===year&&s.goalId===goal.id&&isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingRealAmount(s),0);
  const planned=(state.savings||[]).filter(s=>s.year===year&&s.goalId===goal.id&&!isSavingConfirmed(s)).reduce((sum,s)=>sum+getSavingPlannedAmount(s),0);
  const diff=real-estimated;
  const pct=estimated?Math.round((real/estimated)*100):0;
  return {objective,monthlyTarget,activeMonths,estimated,real,planned,diff,missing:Math.max(0,estimated-real),pct};
}

  return `<div class="bg-white rounded-2xl card-shadow border border-gray-100 p-5 mb-4">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div>
        <h3 class="font-bold text-gray-800 flex items-center gap-2"><i data-lucide="piggy-bank" class="w-5 h-5 text-azul-500"></i>Resumen anual de ahorro</h3>
        <p class="text-sm text-gray-400 mt-1">Desglose separado del ahorro general y de cada meta extra registrada.</p>
      </div>

      <div class="flex items-start justify-between gap-3 mb-3">
        <div><h4 class="font-bold text-gray-800">Ahorro general</h4><p class="text-xs text-gray-400">Solo registros guardados como General. No mezcla metas extra.</p></div>

function updateYearEndExtra(k,v){
  if(!state.config.yearEndExtras) state.config.yearEndExtras={bonusEstimated:0,bonusReal:0,savingsFundEstimated:0,savingsFundReal:0,otherName:'Otro extra',otherEstimated:0,otherReal:0,notes:''};
  state.config.yearEndExtras[k]=(k==='notes'||k==='otherName')?String(v||''):(parseFloat(v)||0);
  saveState();
  render();
}
function exportBackup(){
  const payload={
    app:'Mi plan de pagos',
    version:'1.0',
    exportedAt:new Date().toISOString(),
    data:state
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`mi-plan-de-pagos-respaldo-${date}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importBackup(event){
  const file=event.target.files&&event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const imported=parsed.data||parsed;
      if(!imported||typeof imported!=='object'||!imported.config){alert('El archivo no parece ser un respaldo válido de Mi plan de pagos.');return;}
      if(!confirm('¿Importar este respaldo? Esto reemplazará la información actual de la app en este navegador.'))return;
      state=imported;
      if(!state.config.yearEndExtras) state.config.yearEndExtras={bonusEstimated:0,bonusReal:0,savingsFundEstimated:0,savingsFundReal:0,otherName:'Otro extra',otherEstimated:0,otherReal:0,notes:''};
      if(!state.config.yearEndExtras.otherName) state.config.yearEndExtras.otherName='Otro extra';
      if(!state.savingsGoals||!Array.isArray(state.savingsGoals)) state.savingsGoals=[];
      if(!state.monthNotes||typeof state.monthNotes!=='object') state.monthNotes={};
      if(!Array.isArray(state.fixed)) state.fixed=[];
      if(!Array.isArray(state.installments)) state.installments=[];
      if(!Array.isArray(state.variable)) state.variable=[];
      if(!Array.isArray(state.savings)) state.savings=[];
      if(!Array.isArray(state.accounts)) state.accounts=[];
      if(!state.categories||!Array.isArray(state.categories)) state.categories=[...DEFAULT_CATEGORIES];
      saveState();
      alert('Respaldo importado correctamente.');
      render();
    }catch(err){
      alert('No se pudo importar el archivo. Revisa que sea un .json válido.');
    }finally{
      event.target.value='';
    }
  };
  reader.readAsText(file);
}
function openAccountModal(id=''){const item=getAccounts().find(a=>a.id===id);document.getElementById('modalContent').innerHTML=`<div class="p-5"><div class="flex justify-between mb-4"><h3 class="font-bold">${item?'Editar':'Agregar'} tarjeta/cuenta</h3><button onclick="closeModal()" class="text-xl text-gray-400">×</button></div><form class="space-y-3" onsubmit="saveAccount(event,'${item?.id||''}')"><input name="name" value="${escapeHtml(item?.name||'')}" placeholder="Nombre personalizado" class="w-full border rounded-lg px-3 py-2"><select name="type" class="w-full border rounded-lg px-3 py-2">${ACCOUNT_TYPES.map(t=>`<option value="${t}" ${item?.type===t?'selected':''}>${t}</option>`).join('')}</select><input name="bank" value="${escapeHtml(item?.bank||'')}" placeholder="Banco o institución" class="w-full border rounded-lg px-3 py-2"><textarea name="notes" class="w-full border rounded-lg px-3 py-2" placeholder="Notas opcionales">${escapeHtml(item?.notes||'')}</textarea><button class="w-full bg-lila-500 text-white rounded-lg py-2 font-semibold">Guardar</button></form></div>`;document.getElementById('modal').classList.remove('hidden');}
function saveAccount(event,id=''){event.preventDefault();const fd=new FormData(event.target),payload={name:fd.get('name'),type:fd.get('type'),bank:fd.get('bank'),notes:fd.get('notes')};if(id){const a=state.accounts.find(x=>x.id===id);if(a)Object.assign(a,payload);}else state.accounts.push({id:uid(),...payload});saveState();closeModal();render();}
function deleteAccount(id){state.accounts=state.accounts.filter(a=>a.id!==id);saveState();render();}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal();});document.addEventListener('click',e=>{const pop=document.getElementById('calendarPopover');if(!pop)return;const cal=document.getElementById('miniCalendar');if(pop.contains(e.target))return;if(cal&&cal.contains(e.target)&&e.target.closest('[onclick^="openCalendarPopover"]'))return;closeCalendarPopover();});
function renderSidebar(){const p=getPaymentsForMonth(state.currentMonth,state.currentYear),ts=totalConfirmedSavings(p.sav),goal=state.config.savingsGoal||0,pct=goal?Math.min(100,Math.round(ts/goal*100)):0;document.getElementById('sidebarSavingsTitle').textContent=`Meta de ahorro · ${MONTHS[state.currentMonth]} ${state.currentYear}`;document.getElementById('sidebarSavingsGoal').textContent=fmt(goal);document.getElementById('sidebarSaved').textContent=fmt(ts);document.getElementById('sidebarProgress').style.width=pct+'%';document.getElementById('sidebarTotalSavings').textContent=fmt(totalConfirmedSavings(state.savings));}
document.getElementById('sideNav').addEventListener('click',e=>{const btn=e.target.closest('[data-view]');if(!btn)return;document.querySelectorAll('.sidebar-item').forEach(b=>b.classList.remove('active'));btn.classList.add('active');currentView=btn.dataset.view;render();});
function runSmokeTests(){
  try{
    console.assert(typeof render==='function','render exists');
    console.assert(Array.isArray(state.savings),'savings array exists');
    console.assert(Array.isArray(state.accounts),'accounts array exists');
    console.assert(getStatusVisual('apartado').text==='text-azul-500','apartado blue');
    console.assert(getStatusVisual('pagado').text==='text-menta-500','pagado green');
    console.assert(getStatusVisual('pendiente').text==='text-durazno-500','pendiente orange');
    for(let m=0;m<12;m++){
      [1,2].forEach(q=>{
        const planned=getBiweeklyPlannedTotal(q,m,state.currentYear);
        const aparted=getBiweeklyApartedTotal(q,m,state.currentYear);
        const free=getBiweeklyFreeAmount(q,m,state.currentYear);
        const expected=(state.config.salaryBiweekly||0)-Math.max(planned,aparted);
        console.assert(Math.abs(free-expected)<0.01,`Q${q} ${MONTHS[m]} libre consistente`);
      });
    }
  }catch(e){
    console.warn('Revisión interna omitida para no bloquear la app',e);
  }
}
runSmokeTests();
render();
